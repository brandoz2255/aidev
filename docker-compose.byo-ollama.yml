# ═══════════════════════════════════════════════════════════════════════════
# Bring-your-own Ollama — Harvis talks to an inference server you already run.
# ═══════════════════════════════════════════════════════════════════════════
#
# Selected by `./install.sh --ollama-url URL`, which appends this file to
# COMPOSE_FILE in .env and writes OLLAMA_URL there.
#
# This is a SEPARATE axis from the hardware backend, not a fourth choice: the
# backend container still wants the GPU for Whisper STT and TTS even when
# inference lives elsewhere. So it LAYERS ON TOP of nvidia/amd/cpu, e.g.
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.cpu.yml:docker-compose.byo-ollama.yml
#
# You supply the endpoint in .env:
#   OLLAMA_URL=http://host.docker.internal:11434    # Ollama on this machine
#   OLLAMA_URL=http://192.168.1.50:11434            # Ollama on another box
#
# Every Ollama call site in the backend already reads OLLAMA_URL, so pointing it
# elsewhere needs no code change. This file only stops the bundled server from
# starting — worth ~9.7 GB on a fresh install for anyone already running Ollama.
#
# NOTE: an Ollama on the host is NOT reachable at `localhost` from inside a
# container. Use host.docker.internal (Docker Desktop, and Linux via the
# host-gateway mapping) or the machine's LAN IP.

services:
  # Profiles are opt-in: a service carrying one never starts unless
  # COMPOSE_PROFILES names it. The base file gives these none, so adding one
  # here is what makes them dormant. `bundled-ollama` is deliberately never set
  # by install.sh in this mode — it exists as an escape hatch if you ever want
  # the bundled server back for a single run without switching overlays:
  #   COMPOSE_PROFILES=bundled-ollama docker compose up -d
  ollama:
    profiles: ["bundled-ollama"]

  ollama-model-check:
    profiles: ["bundled-ollama"]

  # These declare depends_on edges to the two services above. Compose treats a
  # dependency on a profile-disabled service as a hard error at `up` time, not a
  # silent skip — so with the edges left in place, enabling the `engines`
  # profile in BYO mode would refuse to start at all. This is the same trap that
  # makes profile-gating a no-op when a false dependency outranks it: cut the
  # edge, or the profile does nothing.
  #
  # `!reset null` drops one map entry and leaves each service's remaining
  # dependencies (pgsql, openclaw-db-init) untouched.
  openclaw:
    depends_on:
      ollama: !reset null
      ollama-model-check: !reset null

  opencode:
    depends_on:
      ollama: !reset null
