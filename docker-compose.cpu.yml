# CPU-only override — no GPU required. Runs the whole stack on any machine.
#
#   ./install.sh --backend cpu          # writes COMPOSE_FILE into .env for you
#   # or manually:
#   docker compose -f docker-compose.yaml -f docker-compose.cpu.yml up -d
#
# Neutralizes all four GPU-touching services from the NVIDIA base:
#   ollama / llmfit / backend  → runtime: runc (drop the nvidia runtime)
#   ollama / llmfit / tts-service → `devices: !reset []` clears the base's
#   `driver: nvidia` reservation. NOTE: a plain `devices: []` does NOT work —
#   compose keeps the base list; the `!reset` YAML tag is required. Empirical
#   floor: Compose 2.19 honours it, 2.18.1 silently ignores it — install.sh
#   verifies the rendered merge behaviorally instead of trusting versions.
#
# Honest expectations on CPU:
#   - Ollama inference runs but is MUCH slower; prefer small models.
#   - Voice (TTS/Whisper) falls back to CPU (torch.cuda guards audited) — slow.
#   - llmfit's NVIDIA_* env vars are inert without the nvidia runtime (left as-is).
#   - Apple Silicon: Docker can't reach the Mac GPU. For Metal speed, run Ollama
#     NATIVELY on the Mac and set OLLAMA_URL=http://host.docker.internal:11434.
services:
  ollama:
    runtime: runc
    deploy:
      resources:
        reservations:
          devices: !reset []

  llmfit:
    runtime: runc
    deploy:
      resources:
        reservations:
          devices: !reset []

  # On a CPU box the pytorch/CUDA base image buys nothing — it just costs ~6 GB
  # of GPU runtime that can never run. Dockerfile.core is the same application
  # on python:3.12-slim with requirements-core.txt only; it asserts at build
  # time that no torch/CUDA package made it in.
  #
  # The trade: no in-process Whisper or TTS. Speech goes to the browser by
  # default, or to the `stt` sidecar (`--profile voice`,
  # HARVIS_STT_PROVIDER=sidecar). The mic route answers 503 with an explanation
  # rather than failing, so nothing else in the stack changes.
  backend:
    runtime: runc
    build:
      dockerfile: Dockerfile.core
    environment:
      # `local` (the base default) means in-process Whisper, which this image
      # deliberately does not carry.
      HARVIS_STT_PROVIDER: "${HARVIS_STT_PROVIDER:-browser}"

  tts-service:
    environment:
      TTS_FORCE_GPU: "false"
    deploy:
      resources:
        reservations:
          devices: !reset []
