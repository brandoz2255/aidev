apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-llama-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-server
spec:
  replicas: 0   # GPU is shared with SGLang pod — scale up one, scale down the other
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: llama-server
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: dulc3-os     # RTX 3070 (8GB) + larger CPU RAM pool
      initContainers:
        # Download Qwen3.5-9B Q4_K_M — skips if already present on the PVC
        - name: download-qwen35
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if [ -f /llama-models/qwen3.5-9b-q4_k_m.gguf ]; then
                echo "Model already present, skipping download"
                exit 0
              fi
              pip install -q huggingface_hub
              python3 -c "
              from huggingface_hub import hf_hub_download
              import shutil
              path = hf_hub_download(
                  repo_id='bartowski/Qwen_Qwen3.5-9B-GGUF',
                  filename='Qwen_Qwen3.5-9B-Q4_K_M.gguf',
                  local_dir='/llama-models',
              )
              shutil.move(path, '/llama-models/qwen3.5-9b-q4_k_m.gguf')
              print('Download complete.')
              "
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
      containers:
        # llama-server — Qwen3.5-9B Q4_K_M on RTX 3070 (8GB VRAM)
        # ~5.4GB model: all 36 layers fit entirely in GPU VRAM — no CPU offload needed
        # Note: requires GPU time-slicing if SGLang sidecar is also scheduled on dulc3-os
        - name: llama-server
          image: yusiwen/llama.cpp:latest
          imagePullPolicy: Always
          ports:
            - name: llama
              containerPort: 8080
              protocol: TCP
          command: ["llama-server"]
          args:
            - "--model"
            - "/llama-models/qwen3.5-9b-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--n-gpu-layers"
            - "99"             # all layers on GPU — RTX 3070 8GB fits full Q4_K_M (~5.4GB)
            - "--ctx-size"
            - "65536"          # 64K context; remaining ~2.6GB VRAM covers KV cache
            - "--cache-type-k"
            - "q8_0"           # higher quality KV — viable with 8GB VRAM
            - "--cache-type-v"
            - "q8_0"
            - "--n-parallel"
            - "4"              # 4 concurrent slots — full GPU inference supports concurrency
            - "--threads"
            - "8"              # CPU threads (only for non-GPU work)
            - "--threads-batch"
            - "8"
            - "--no-mmap"      # pre-load weights into VRAM (avoids page faults)
            - "--served-model-name"
            - "qwen3.5:9b"     # matches vLLM sidecar served-model-name
            - "--log-disable"
          # No CUDA_VISIBLE_DEVICES — dulc3-os has 1 GPU, no pinning needed
          resources:
            requests:
              memory: 4Gi     # weights in VRAM; CPU RAM only for overhead + KV spillover
              cpu: 2000m
            limits:
              nvidia.com/gpu: 1
              memory: 8Gi
              cpu: 8000m
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

      volumes:
        - name: llama-models
          persistentVolumeClaim:
            claimName: llama-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-llama-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-server
spec:
  type: ClusterIP
  ports:
    - name: llama
      port: 8080
      targetPort: llama
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-server
