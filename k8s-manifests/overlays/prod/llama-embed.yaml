# llama-embed — embedding servers on dulc3-top (1650 Ti)
#
# Storage: PV+PVC defined here so ArgoCD (overlays/prod path) can manage them.
# Pre-requisite on dulc3-top: sudo mkdir -p /data/embed-models && sudo chmod 755 /data/embed-models
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: embed-model-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /data/embed-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - dulc3-top
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embed-model-cache
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-embed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeName: embed-model-pv
---
# llama-embed — CPU embedding servers on dulc3-top (1650 Ti)
#
# Two llama.cpp server processes, each loaded with one embedding model:
#   embed-nomic  (port 8081): nomic-embed-text-v1.5  768 dims  — STANDARD tier (docs)
#   embed-qwen3  (port 8082): Qwen3-Embedding-4B     2560 dims — HIGH tier (code)
#
# embed-nomic: CPU-only (-ngl 0) — 274MB model, negligible CPU load
# embed-qwen3: GPU (-ngl 99) — 2.5GB Q4_K_M fits in 1650 Ti 4GB, fast GPU embedding for code RAG
#
# Service: harvis-ai-llama-embed
#   port 8081 → embed-nomic   (nomic-embed-text)
#   port 8082 → embed-qwen3   (Qwen3-Embedding-4B)
#
# Backend uses:
#   EMBED_NOMIC_URL=http://harvis-ai-llama-embed:8081
#   EMBED_QW3_URL=http://harvis-ai-llama-embed:8082
#
# Pre-requisite on dulc3-top:
#   sudo mkdir -p /data/embed-models && sudo chmod 755 /data/embed-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-llama-embed
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: llama-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: llama-embed
    spec:
      runtimeClassName: nvidia              # needed for GPU access on embed-qwen3 container
      nodeSelector:
        kubernetes.io/hostname: dulc3-top    # 1650 Ti (4GB) — qwen3-embed on GPU, nomic on CPU
      initContainers:
        # Fix PVC permissions first — local PVs are owned by root by default,
        # curlimages/curl runs as non-root (curl_user) and can't write without this.
        - name: fix-permissions
          image: busybox:1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          command: ["sh", "-c", "chmod 777 /embed-models && echo 'permissions fixed'"]
          securityContext:
            runAsUser: 0    # must run as root to chmod the PVC mount
          volumeMounts:
            - name: embed-models
              mountPath: /embed-models
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

        # Download nomic-embed-text-v1.5 Q4_K_M (~274MB) — skip if present
        - name: download-nomic
          image: curlimages/curl:8.13.0@sha256:e6ebb770fb6e2236c2e83ad6b6dbbd32cb6dff0b17a9482a7d4bca20f1c9b50a
          command: ["/bin/sh", "-c"]
          securityContext:
            runAsUser: 0    # run as root so curl can write to PVC mount
          args:
            - |
              set -e
              DEST=/embed-models/nomic-embed-text-v1.5.Q4_K_M.gguf
              if [ -f "$DEST" ]; then
                echo "nomic model already present, skipping"
                exit 0
              fi
              echo "Downloading nomic-embed-text-v1.5.Q4_K_M.gguf..."
              curl -fL \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -o "${DEST}.tmp" \
                "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
              mv "${DEST}.tmp" "$DEST"
              echo "nomic download complete: $(du -sh $DEST | cut -f1)"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
                  optional: true
          volumeMounts:
            - name: embed-models
              mountPath: /embed-models
          resources:
            requests:
              memory: 32Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 500m

        # Download Qwen3-Embedding-4B Q4_K_M (~2.5GB) — skip if present
        - name: download-qwen3-embed
          image: curlimages/curl:8.13.0@sha256:e6ebb770fb6e2236c2e83ad6b6dbbd32cb6dff0b17a9482a7d4bca20f1c9b50a
          command: ["/bin/sh", "-c"]
          securityContext:
            runAsUser: 0    # run as root so curl can write to PVC mount
          args:
            - |
              set -e
              DEST=/embed-models/Qwen3-Embedding-4B-Q4_K_M.gguf
              if [ -f "$DEST" ]; then
                echo "qwen3-embedding model already present, skipping"
                exit 0
              fi
              echo "Downloading Qwen3-Embedding-4B-Q4_K_M.gguf..."
              curl -fL \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -o "${DEST}.tmp" \
                "https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q4_K_M.gguf"
              mv "${DEST}.tmp" "$DEST"
              echo "qwen3-embedding download complete: $(du -sh $DEST | cut -f1)"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
                  optional: true
          volumeMounts:
            - name: embed-models
              mountPath: /embed-models
          resources:
            requests:
              memory: 32Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 500m

      containers:
        # embed-nomic — nomic-embed-text-v1.5, 768 dims, STANDARD tier
        # CPU-only: -ngl 0; ~274MB model, fast on CPU for RAG batch workloads
        - name: embed-nomic
          image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c12b8a7325a1b5cc1480cb44d026518860f4810c5cf77dc450bdd05d87231062
          imagePullPolicy: IfNotPresent
          ports:
            - name: embed-nomic
              containerPort: 8081
              protocol: TCP
          command: ["/app/llama-server"]
          args:
            - "--model"
            - "/embed-models/nomic-embed-text-v1.5.Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8081"
            - "--embeddings"           # enable /v1/embeddings endpoint
            - "--pooling"
            - "mean"                   # nomic-embed-text uses mean pooling
            - "--ctx-size"
            - "8192"
            - "--n-gpu-layers"
            - "0"                      # CPU-only — GPU reserved for future RPC
            - "--threads"
            - "4"
            - "--threads-batch"
            - "4"
            - "--no-mmap"
          volumeMounts:
            - name: embed-models
              mountPath: /embed-models
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 2000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

        # embed-qwen3 — Qwen3-Embedding-4B Q4_K_M, 2560 dims, HIGH tier (code/technical)
        # GPU: ~2.5GB weights fit in 1650 Ti 4GB with ~1.5GB headroom for KV + overhead
        # Q4_K_M quality loss vs BF16: <0.5% on MTEB — negligible for RAG use
        # Embedding forward-pass only (no generation) so KV cache is essentially zero
        - name: embed-qwen3
          image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c12b8a7325a1b5cc1480cb44d026518860f4810c5cf77dc450bdd05d87231062
          imagePullPolicy: IfNotPresent
          ports:
            - name: embed-qwen3
              containerPort: 8082
              protocol: TCP
          command: ["/app/llama-server"]
          args:
            - "--model"
            - "/embed-models/Qwen3-Embedding-4B-Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8082"
            - "--embeddings"           # enable /v1/embeddings endpoint
            - "--pooling"
            - "last"                   # Qwen3-Embedding uses last-token pooling
            - "--ctx-size"
            - "2048"                   # 2048 sufficient for RAG chunks; 8192 OOMs 4GB VRAM (1.15GB KV cache)
            - "--n-gpu-layers"
            - "99"                     # full GPU offload — all layers fit in 1650 Ti 4GB
            - "--no-mmap"
          volumeMounts:
            - name: embed-models
              mountPath: /embed-models
          resources:
            requests:
              memory: 512Mi            # weights are in VRAM, not RAM
              cpu: 250m
            limits:
              nvidia.com/gpu: 1        # 1650 Ti — ~2.8GB used, 1.2GB headroom
              memory: 4Gi              # --no-mmap loads full 2.5GB model into RAM before VRAM transfer
              cpu: 2000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: embed-models
          persistentVolumeClaim:
            claimName: embed-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-llama-embed
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-embed
spec:
  type: ClusterIP
  ports:
    - name: embed-nomic
      port: 8081
      targetPort: embed-nomic
      protocol: TCP
    - name: embed-qwen3
      port: 8082
      targetPort: embed-qwen3
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: llama-embed
