apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-merged-ollama-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: merged-ollama-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: merged-ollama-backend
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1001   # ensures PVC mounts are writable by appuser (UID 1001) without chown
      nodeSelector:
        kubernetes.io/hostname: dulc3-os    # RTX 3070 — llama.cpp runs here
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL at harvis-ai-pgsql:5432..."
              until nc -z harvis-ai-pgsql 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "✅ PostgreSQL is ready!"
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m
        # [DISABLED] Download Qwen3-8B Q4_K_M — too large for RTX 3070 in desktop mode (~5.5GB VRAM)
        # Replaced by the 2B distilled model below. Re-enable when k8s VRAM operator is in place.
        # - name: download-qwen35
        #   image: curlimages/curl:latest
        #   args:
        #     - DEST=/llama-models/Qwen3-8B-Q4_K_M.gguf
        #     - curl -fL -H "Authorization: Bearer ${HF_TOKEN}" -o "${DEST}.tmp"
        #       "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf"

        # Download Qwen3.5-2B Claude-4.6 Opus Reasoning-Distilled Q4_K_M (~1.27GB)
        # Fits easily on RTX 3070 8GB leaving plenty of VRAM for KV cache and TTS/Whisper on CPU.
        - name: download-qwen35-2b
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              DEST=/llama-models/Qwen3.5-2B.Q4_K_M.gguf
              if [ -f "$DEST" ]; then
                echo "Model already present, skipping download"
                exit 0
              fi
              echo "Downloading Qwen3.5-2B.Q4_K_M.gguf from HuggingFace..."
              curl -fL \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -o "${DEST}.tmp" \
                "https://huggingface.co/Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.5-2B.Q4_K_M.gguf"
              mv "${DEST}.tmp" "$DEST"
              echo "Download complete: $(du -sh $DEST | cut -f1)"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 500m

      containers:
        # Harvis Backend
        - name: harvis-backend
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: database-url
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: ollama-api-key
            - name: EXTERNAL_OLLAMA_URL
              value: "https://coyotedev.ngrok.app/ollama"
            - name: EXTERNAL_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: external-ollama-api-key
                  optional: true
            # Embedding servers on dulc3-top (llama.cpp, CPU-only, OpenAI-compatible)
            - name: OLLAMA_URL
              value: "http://harvis-ai-llama-embed:8081"   # backward compat — points to nomic
            - name: EMBED_NOMIC_URL
              value: "http://harvis-ai-llama-embed:8081"   # nomic-embed-text, 768 dims
            - name: EMBED_QW3_URL
              value: "http://harvis-ai-llama-embed:8082"   # Qwen3-Embedding-4B, 2560 dims
            - name: VLLM_URL
              value: "http://localhost:8080/v1"   # llama-server (Qwen3.5-2B distilled Q4_K_M)
            # llama-server co-located sidecar (localhost)
            - name: LLAMA_URL
              value: "http://localhost:8080/v1"
            - name: BACKEND_URL
              value: "http://harvis-ai-merged-backend:8000"
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: TMPDIR
              value: "/tmp"
            - name: DISABLE_LOCAL_TTS_WORKERS
              value: "false"  # TTS/Whisper run locally in this pod (moved from separate worker)
            - name: TTS_DEVICE
              value: "cpu"   # Run TTS on CPU (GPU is full with llama-server)
            - name: WHISPER_DEVICE
              value: "cpu"    # Run Whisper on CPU to save GPU memory for LLM
            - name: UVICORN_WORKERS
              value: "1"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
          envFrom:
            - configMapRef:
                name: harvis-ai-backend-config
            - secretRef:
                name: harvis-ai-backend-secret
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              memory: 32Gi
              cpu: 12000m
          volumeMounts:
            - name: embedding
              mountPath: /app/embedding
            - name: tmp
              mountPath: /tmp
            - name: ml-models-cache
              mountPath: /models-cache
            - name: images
              mountPath: /app/images
            - name: artifacts
              mountPath: /data/artifacts
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--timeout-keep-alive"
            - "120"
            - "--log-level"
            - "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # llama-server — Qwen3.5-2B Claude-4.6 Opus Reasoning-Distilled Q4_K_M on RTX 3070 (8GB)
        # ~1.27GB weights → leaves ~6.5GB free for 128K KV cache (q8_0) + GPU overhead
        # Swapped from 8B (too large for desktop mode) — k8s VRAM operator will auto-select model later
        # [DISABLED MODEL]: Qwen3-8B-Q4_K_M.gguf — re-enable when VRAM operator is deployed
        # - "--model"
        # - "/llama-models/Qwen3-8B-Q4_K_M.gguf"
        # - "--alias"
        # - "qwen3:8b"
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          imagePullPolicy: Always
          ports:
            - name: llama
              containerPort: 8080
              protocol: TCP
          command: ["/app/llama-server"]
          args:
            - "--model"
            - "/llama-models/Qwen3.5-2B.Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--n-gpu-layers"
            - "99"
            - "--ctx-size"
            - "131072"         # 128K context — plenty of VRAM with 2B model
            - "--parallel"
            - "8"              # 8 concurrent slots (2B is light, lots of headroom)
            - "--alias"
            - "qwen3.5:2b"
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          resources:
            requests:
              memory: 1Gi      # 2B model is much lighter than 8B
              cpu: 500m
            limits:
              nvidia.com/gpu: 1
              memory: 6Gi      # 1.27GB weights + 128K KV cache at q8_0 + overhead
              cpu: 4000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

      volumes:
        - name: embedding
          persistentVolumeClaim:
            claimName: harvis-ai-embedding-pvc
        - name: ml-models-cache
          persistentVolumeClaim:
            claimName: ml-models-cache
        - name: tmp
          persistentVolumeClaim:
            claimName: harvis-audio-pvc
        - name: images
          persistentVolumeClaim:
            claimName: harvis-images-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: harvis-artifacts-pvc
        - name: llama-models
          persistentVolumeClaim:
            claimName: llama-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-merged-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
