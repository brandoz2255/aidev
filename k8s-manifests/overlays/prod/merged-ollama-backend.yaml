apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-merged-ollama-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: merged-ollama-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: merged-ollama-backend
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1001   # ensures PVC mounts are writable by appuser (UID 1001) without chown
      nodeSelector:
        kubernetes.io/hostname: dulc3-os    # RTX 3070 — SGLang runs here
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL at harvis-ai-pgsql:5432..."
              until nc -z harvis-ai-pgsql 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "✅ PostgreSQL is ready!"
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m
        - name: download-models
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              python3 /app/download_models.py
              echo '🔧 Fixing model cache permissions for appuser...'
              chown -R 1001:1001 /models-cache
              echo '✅ Model cache permissions fixed'
          env:
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: DOWNLOAD_QWEN_TTS
              value: "true"
            - name: DOWNLOAD_CHATTERBOX_TTS
              value: "false"
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 2000m
        # Download Qwen3.5-9B Q4_K_M GGUF for llama-server — skips if already on PVC
        - name: download-qwen35
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if [ -f /llama-models/qwen3.5-9b-q4_k_m.gguf ]; then
                echo "Model already present, skipping download"
                exit 0
              fi
              pip install -q huggingface_hub
              python3 -c "
              from huggingface_hub import hf_hub_download
              import shutil
              path = hf_hub_download(
                  repo_id='bartowski/Qwen_Qwen3.5-9B-GGUF',
                  filename='Qwen_Qwen3.5-9B-Q4_K_M.gguf',
                  local_dir='/llama-models',
              )
              shutil.move(path, '/llama-models/qwen3.5-9b-q4_k_m.gguf')
              print('Download complete.')
              "
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
      containers:
        # SGLang — Qwen3.5-9B INT4 (bitsandbytes) on RTX 3070 (8GB), fast agentic path
        # RadixAttention: shared prefix KV cache stays hot across tool calls.
        # MTP speculative decoding: 2-3x decode speedup on predictable code tokens.
        # fp8 KV cache unlocks 131K context on 8GB VRAM vs 65K with vLLM.
        - name: sglang
          image: dulc3/sglang-patch:test9
          imagePullPolicy: IfNotPresent
          ports:
            - name: sglang
              containerPort: 8001
              protocol: TCP
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - "--model"
            - "Qwen/Qwen3.5-4B"     # base 4B — bitsandbytes NF4 works here; compressed-tensors/Marlin breaks on 4B GQA (size_n=32, not divisible by 64)
            - "--served-model-name"
            - "qwen3.5:4b"
            - "--port"
            - "8001"
            - "--host"
            - "0.0.0.0"
            - "--quantization"
            - "bitsandbytes"        # NF4: 4B weights ~2.25GB — well within headroom after 0.45 KV pre-alloc
            - "--load-format"
            - "bitsandbytes"
            - "--kv-cache-dtype"
            - "fp8_e4m3"            # fp8 KV: 131k ctx ≈ 2.0GB, fits in 3.44GB pool
            - "--context-length"
            - "131072"              # full 128k: 0.45×7.64=3.44GB KV pool; 4B NF4 load=~3.75GB; total ~7.2GB ✅
            - "--mem-fraction-static"
            - "0.45"                # 3.44GB KV pre-alloc; leaves 4.2GB for 4B NF4 weights+runtime (~3.75GB) ✅
            - "--enable-torch-compile"
            - "--reasoning-parser"
            - "qwen3"               # handles <think>...</think> blocks
            - "--tool-call-parser"
            - "qwen3_coder"         # correct tool parser for Qwen3.5 family — tool calling is automatic in SGLang via parser, no --enable-auto-tool-choice needed
            - "--trust-remote-code"
            # NEXTN MTP speculative decoding — patched image fixes the two upstream bugs:
            #   Bug 1: speculative_eagle_topk null-guard (NoneType > int crash)
            #   Bug 2: served_model_name colon assertion made LoRA-conditional
            # Qwen3.5 (Qwen3_5ForConditionalGeneration) is a hybrid Mamba arch — radix cache +
            # speculative decoding requires extra_buffer + SGLANG_ENABLE_SPEC_V2=1.
            - "--speculative-algo"
            - "NEXTN"
            - "--speculative-num-steps"
            - "3"
            - "--speculative-num-draft-tokens"
            - "4"
            - "--mamba-scheduler-strategy"
            - "extra_buffer"
          env:
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: SGLANG_ENABLE_SPEC_V2
              value: "1"
            - name: SGLANG_DISABLE_CUDNN_CHECK
              value: "1"
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 4Gi
              cpu: 500m
            limits:
              nvidia.com/gpu: 1
              memory: 12Gi
              cpu: 4000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 180   # SGLang torch.compile adds ~2min startup
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

        # Harvis Backend
        - name: harvis-backend
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: database-url
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: ollama-api-key
            - name: EXTERNAL_OLLAMA_URL
              value: "https://coyotedev.ngrok.app/ollama"
            - name: EXTERNAL_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: external-ollama-api-key
                  optional: true
            # SGLang co-located sidecar (localhost)
            - name: OLLAMA_URL
              value: "http://localhost:8001/v1"
            - name: VLLM_URL
              value: "http://localhost:8001/v1"
            # llama-server co-located sidecar (localhost)
            - name: LLAMA_URL
              value: "http://localhost:8080/v1"
            - name: BACKEND_URL
              value: "http://harvis-ai-merged-backend:8000"
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: TMPDIR
              value: "/tmp"
            - name: DISABLE_LOCAL_TTS_WORKERS
              value: "true"   # TTS/Whisper run in tts-worker pod; skip GPU allocation here
            - name: UVICORN_WORKERS
              value: "1"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
          envFrom:
            - configMapRef:
                name: harvis-ai-backend-config
            - secretRef:
                name: harvis-ai-backend-secret
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              memory: 32Gi
              cpu: 12000m
          volumeMounts:
            - name: embedding
              mountPath: /app/embedding
            - name: tmp
              mountPath: /tmp
            - name: ml-models-cache
              mountPath: /models-cache
            - name: images
              mountPath: /app/images
            - name: artifacts
              mountPath: /data/artifacts
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--timeout-keep-alive"
            - "120"
            - "--log-level"
            - "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # llama-server — Qwen3.5-9B Q4_K_M on RTX 3070, shares GPU with sglang via same pod
        # All 36 layers fit in 8GB VRAM (~5.4GB model). Use for llama.cpp-native features
        # or as fallback when SGLang is restarting. Switch via LLAMA_URL in backend.
        - name: llama-server
          image: ghcr.io/ggerganov/llama.cpp:server-cuda
          imagePullPolicy: Always
          ports:
            - name: llama
              containerPort: 8080
              protocol: TCP
          command: ["/llama-server"]
          args:
            - "--model"
            - "/llama-models/qwen3.5-9b-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--n-gpu-layers"
            - "99"             # all layers in VRAM — RTX 3070 8GB fits full Q4_K_M (~5.4GB)
            - "--ctx-size"
            - "65536"          # 64K; remaining ~2.6GB VRAM covers KV cache
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--n-parallel"
            - "4"
            - "--threads"
            - "8"
            - "--threads-batch"
            - "8"
            - "--no-mmap"
            - "--served-model-name"
            - "qwen3.5:9b"
            - "--log-disable"
          volumeMounts:
            - name: llama-models
              mountPath: /llama-models
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
            limits:
              memory: 6Gi     # no nvidia.com/gpu here — shared via pod-level allocation
              cpu: 4000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

      volumes:
        - name: embedding
          persistentVolumeClaim:
            claimName: harvis-ai-embedding-pvc
        - name: ml-models-cache
          persistentVolumeClaim:
            claimName: ml-models-cache
        - name: tmp
          persistentVolumeClaim:
            claimName: harvis-audio-pvc
        - name: images
          persistentVolumeClaim:
            claimName: harvis-images-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: harvis-artifacts-pvc
        - name: llama-models
          persistentVolumeClaim:
            claimName: llama-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-merged-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 8000
      targetPort: http
      protocol: TCP
    - name: sglang
      port: 8001
      targetPort: sglang      # qwen3.5 via SGLang on dulc3-os
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
