apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-merged-ollama-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: merged-ollama-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: merged-ollama-backend
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1001   # ensures PVC mounts are writable by appuser (UID 1001) without chown
      nodeSelector:
        kubernetes.io/hostname: dulc3-os    # RTX 5090 32GB
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL at harvis-ai-pgsql:5432..."
              until nc -z harvis-ai-pgsql 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "✅ PostgreSQL is ready!"
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

        - name: download-gguf
          image: alpine:3
          command: ['sh', '-c']
          args:
            - |
              DEST=/models-cache/gguf/Qwen3.5-27B.Q4_K_M.gguf
              if [ -f "$DEST" ]; then
                echo "✅ GGUF already cached at $DEST, skipping download"
                exit 0
              fi
              mkdir -p /models-cache/gguf
              echo "Downloading Qwen3.5-27B.Q4_K_M.gguf (~16.5GB)..."
              apk add --no-cache curl
              curl -L --fail --show-error \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -o "$DEST.tmp" \
                "https://huggingface.co/Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.5-27B.Q4_K_M.gguf"
              mv "$DEST.tmp" "$DEST"
              echo "✅ Download complete: $(du -h $DEST | cut -f1)"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 500m

      containers:
        # Harvis Backend
        - name: harvis-backend
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: database-url
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: ollama-api-key
            - name: EXTERNAL_OLLAMA_URL
              value: "https://coyotedev.ngrok.app/ollama"
            - name: EXTERNAL_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: external-ollama-api-key
                  optional: true
            # Embedding servers on dulc3-top (llama.cpp, CPU-only, OpenAI-compatible)
            - name: OLLAMA_URL
              value: "http://harvis-ai-llama-embed:8081"   # backward compat — points to nomic
            - name: EMBED_NOMIC_URL
              value: "http://harvis-ai-llama-embed:8081"   # nomic-embed-text, 768 dims
            - name: EMBED_QW3_URL
              value: "http://harvis-ai-llama-embed:8082"   # Qwen3-Embedding-4B, 2560 dims
            # llama.cpp sidecar (localhost:8080) — OpenAI-compatible
            - name: VLLM_URL
              value: "http://localhost:8080/v1"
            - name: LLAMA_URL
              value: "http://localhost:8080/v1"
            - name: BACKEND_URL
              value: "http://harvis-ai-merged-backend:8000"
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: TMPDIR
              value: "/tmp"
            - name: DISABLE_LOCAL_TTS_WORKERS
              value: "false"
            - name: TTS_DEVICE
              value: "cpu"
            - name: WHISPER_DEVICE
              value: "cpu"
            - name: UVICORN_WORKERS
              value: "1"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
          envFrom:
            - configMapRef:
                name: harvis-ai-backend-config
            - secretRef:
                name: harvis-ai-backend-secret
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              memory: 32Gi
              cpu: 12000m
          volumeMounts:
            - name: embedding
              mountPath: /app/embedding
            - name: tmp
              mountPath: /tmp
            - name: ml-models-cache
              mountPath: /models-cache
            - name: images
              mountPath: /app/images
            - name: artifacts
              mountPath: /data/artifacts
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--timeout-keep-alive"
            - "120"
            - "--log-level"
            - "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # llama.cpp server — Qwen3.5-27B Q4_K_M on RTX 5090 (32GB)
        #
        # Why llama.cpp instead of SGLang:
        #   SGLang blocked by Marlin sm_120 (Blackwell) kernel bug — all INT4/AWQ formats
        #   silently corrupt weights or OOM. fp8 runtime quant uses ~27GB leaving no KV room.
        #   llama.cpp uses its own CUDA GEMM path (not Marlin) → works on sm_120 natively.
        #   Ollama already confirmed Qwen3.5-27B Q4_K_M works on this GPU via llama.cpp.
        #
        # Model: Qwen3.5-27B Q4_K_M GGUF
        #   ~15GB on disk, ~15GB VRAM → leaves ~16GB free for KV + mamba SSM state
        #
        # Context: 262144 (262K native max)
        #   No YaRN — staying within native context avoids RoPE extrapolation CPU overhead.
        #   KV for hybrid model — llama.cpp only allocates KV for the 16 full-attention
        #   layers (not the 48 GDN/SSM layers) → efficient KV usage.
        #   Estimated KV at 262K q4_0: ~1.0GB (vs ~2.0GB at 512K)
        #
        # --flash-attn: required for long context efficiency on sm_120
        # -ngl 99: all layers on GPU (model fits at ~15GB, ~16GB headroom remaining)
        # --parallel 1: single slot (single user system, avoids KV multiplication)
        # --cache-type-k q4_0 / --cache-type-v q4_0: quantized KV → minimal KV footprint
        #
        # Model: Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-GGUF  Q4_K_M
        #   Dense 27B (NOT MoE) — repo card: 16.5GB VRAM at Q4_K_M, 29-35 tok/s, 262K ctx.
        #   SGLang previously OOM'd loading this as qwen2_moe — that was a SGLang mis-detection
        #   bug, not the model's actual architecture. llama.cpp GGUF loads correctly.
        #   LLAMA_CACHE env points to PVC so model is cached across pod restarts.
        #
        # API compatibility: llama-server exposes OpenAI-compatible /v1/chat/completions
        #   and /v1/completions at port 8080. Backend LLAMA_URL=http://localhost:8080/v1
        #   already points here — no backend changes needed.
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          imagePullPolicy: Always
          ports:
            - name: llama
              containerPort: 8080
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
            # CUDA_VISIBLE_DEVICES: use the single GPU in this pod
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          args:
            # Model loaded from PVC (downloaded by download-gguf init container)
            - "-m"
            - "/models-cache/gguf/Qwen3.5-27B.Q4_K_M.gguf"
            - "--alias"
            - "qwen3.5-27b"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            # Context and GPU
            - "--ctx-size"
            - "262144"   # 262K native max — no YaRN needed, avoids extrapolation CPU overhead
            - "-ngl"
            - "99"          # all layers on GPU
            - "--flash-attn"
            - "on"
            # Parallel slots — at native 262K ctx, single slot is fine for this system.
            - "--parallel"
            - "1"
            # KV cache quantization — q4_0 at 262K × 16 attn layers ≈ 1.0GB
            - "--cache-type-k"
            - "q4_0"
            - "--cache-type-v"
            - "q4_0"
            # No --chat-template: use template embedded in GGUF metadata.
            # Jackrong's distilled model has a custom template — overriding with "qwen"
            # corrupts conversation structure → hallucinated questions, language switches.
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 4Gi
              cpu: 500m
            limits:
              nvidia.com/gpu: 1
              memory: 28Gi
              cpu: 8000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 300   # first run downloads ~15GB GGUF; subsequent runs ~10s
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 60    # subsequent restarts: model loads in <30s from PVC cache
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10

      volumes:
        - name: embedding
          persistentVolumeClaim:
            claimName: harvis-ai-embedding-pvc
        - name: ml-models-cache
          persistentVolumeClaim:
            claimName: ml-models-cache
        - name: tmp
          persistentVolumeClaim:
            claimName: harvis-audio-pvc
        - name: images
          persistentVolumeClaim:
            claimName: harvis-images-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: harvis-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-merged-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 8000
      targetPort: http
      protocol: TCP
    - name: llama
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
---
# NodePort for external access — local opencode vibe coding sessions on host machine.
# Access llama-cpp directly: http://dulc3-os:30880/v1/chat/completions
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-llama-nodeport
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: NodePort
  ports:
    - name: llama
      port: 8080
      targetPort: 8080
      nodePort: 30880
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
