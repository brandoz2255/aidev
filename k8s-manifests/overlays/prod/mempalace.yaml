---
# MemPalace MCP Server — shared AI memory pod
# Accessible as HTTP+SSE MCP at:
#   - Internal (pods):     http://harvis-mempalace:8095/sse
#   - Host (Claude Code):  http://192.168.4.247:8095/sse
#
# To add the LoadBalancer IP to MetalLB pool (if not already):
#   kubectl edit ipaddresspool harvis-ip-pool -n metallb-system
#   → extend addresses to: 192.168.4.241-192.168.4.247
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mempalace-palace-data
  namespace: ai-agents
  labels:
    app: harvis-mempalace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-mempalace
  namespace: ai-agents
  labels:
    app: harvis-mempalace
    component: mcp-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harvis-mempalace
  template:
    metadata:
      labels:
        app: harvis-mempalace
        component: mcp-memory
    spec:
      containers:
      - name: mempalace
        image: dulc3/harvis-mempalace
        imagePullPolicy: Always
        ports:
        - containerPort: 8095
          name: http
        env:
        - name: MEMPALACE_PALACE_PATH
          value: /data/palace
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: palace-data
          mountPath: /data/palace
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: palace-data
        persistentVolumeClaim:
          claimName: mempalace-palace-data
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-mempalace
  namespace: ai-agents
  labels:
    app: harvis-mempalace
  annotations:
    metallb.universe.tf/address-pool: local-pool
spec:
  selector:
    app: harvis-mempalace
  ports:
  - name: http
    port: 8095
    targetPort: 8095
    protocol: TCP
  type: LoadBalancer
  loadBalancerIP: 192.168.4.247
