apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources (now local)
resources:
  - frontend.yaml
  - nginx.yaml
  - merged-ollama-backend.yaml
  - document-worker.yaml
  - openclaw.yaml

# Namespace
namespace: ai-agents

# Image updates
images:
  - name: harvis-backend
    newName: dulc3/jarvis-backend
    newTag: v2.30.16
  - name: harvis-frontend
    newName: dulc3/jarvis-frontend
    newTag: v2.30.16
  - name: harvis-document-worker
    newName: dulc3/harvis-document-worker
    newTag: v2.30.16
  - name: dulc3/openclaw
    newName: dulc3/openclaw
    newTag: v2.30.13

# Patches for production
patches:
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/1/image
        value: dulc3/jarvis-backend:v2.30.16
      - op: replace
        path: /spec/template/spec/initContainers/1/image
        value: dulc3/jarvis-backend:v2.30.16
  - target:
      kind: Deployment
      name: harvis-ai-frontend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-frontend:v2.30.16
  - target:
      kind: Deployment
      name: harvis-document-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/harvis-document-worker:v2.30.16

  # Inject OpenClaw + Kimi K2.5 env vars into the backend container (index 1 = harvis-backend)
  # so the Python orchestrator knows where to find OpenClaw and has the Moonshot API key.
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value:
          name: OPENCLAW_URL
          value: "ws://harvis-ai-openclaw:18789"
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value:
          name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: openclaw-gateway-token
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value:
          name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: moonshot-api-key
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value:
          name: MOONSHOT_BASE_URL
          value: "https://api.moonshot.ai/v1"
      # HARVIS_GITHUB_TOKEN / HARVIS_GITHUB_USER / HARVIS_GITHUB_EMAIL removed —
      # GitHub auth is now handled by the HarvisAI GitHub App (App ID 2995570).
      # The harvis-github skill mints short-lived installation tokens at runtime
      # using GH_APP_ID + GH_INSTALLATION_ID + GH_PRIVATE_KEY in the openclaw pod.
