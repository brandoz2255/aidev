apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources (now local)
resources:
  - ../../base
  - frontend.yaml
  - nginx.yaml
  - merged-ollama-backend.yaml
  # - tts-worker.yaml  # REMOVED: TTS/Whisper now runs in main backend pod
  - document-worker.yaml
  - openclaw.yaml
  - llama-embed.yaml
  - mcp-rag-server.yaml
  - mempalace.yaml

# Namespace
namespace: ai-agents

# Image updates
images:
  - name: harvis-backend
    newName: dulc3/jarvis-backend
    newTag: v2.35.3s
  - name: harvis-frontend
    newName: dulc3/jarvis-frontend
    newTag: v2.35.3s
  - name: harvis-document-worker
    newName: dulc3/harvis-document-worker
    newTag: v2.35.3s
 # - name: harvis-tts-worker  # REMOVED: TTS/Whisper now runs in main backend
  #   newName: harvis-tts-worker
  #   newTag: unbroken
  - name: dulc3/openclaw
    newName: dulc3/openclaw
    newTag: n
  - name: dulc3/harvis-mempalace
    newName: dulc3/harvis-mempalace
    newTag: v2.35.3s

# Patches for production
patches:
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-backend:v2.35.3s
  - target:
      kind: Deployment
      name: harvis-ai-frontend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-frontend:v2.35.3s
  - target:
      kind: Deployment
      name: harvis-document-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/harvis-document-worker:v2.35.3s
  - target:
      kind: Deployment
      name: harvis-ai-mcp-rag
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-backend:v2.35.3s

  # Inject OpenClaw + Kimi K2.5 env vars into the backend container (index 0 = harvis-backend)
  # so the Python orchestrator knows where to find OpenClaw and has the Moonshot API key.
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENCLAW_URL
          value: "ws://harvis-ai-openclaw:18789"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: openclaw-gateway-token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: moonshot-api-key
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOONSHOT_BASE_URL
          value: "https://api.moonshot.ai/v1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: nvidia-api-key
              optional: true
      # HARVIS_GITHUB_TOKEN / HARVIS_GITHUB_USER / HARVIS_GITHUB_EMAIL removed —
      # GitHub auth is now handled by the HarvisAI GitHub App (App ID 2995570).
      # The harvis-github skill mints short-lived installation tokens at runtime
      # using GH_APP_ID + GH_INSTALLATION_ID + GH_PRIVATE_KEY in the openclaw pod.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLAMA_URL
          value: "http://localhost:8080/v1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EMBED_QW3_URL
          value: "http://harvis-ai-llama-embed:8082"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EMBED_NOMIC_URL
          value: "http://harvis-ai-llama-embed:8081"
