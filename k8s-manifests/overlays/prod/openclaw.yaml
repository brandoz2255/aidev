# Harvis RAG SKILL.md — lets OpenClaw agents search the Harvis pgvector DB
# via the backend's /rag/search proxy endpoint.
# OpenClaw reads this from /skills/harvis-rag/SKILL.md via skills.load.extraDirs.
# No credentials needed: auth is via OPENCLAW_GATEWAY_TOKEN already in the env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvis-rag-skill
  namespace: ai-agents
data:
  SKILL.md: |
    ---
    name: harvis-rag
    description: Search the Harvis local vector database for relevant code and documentation
    always: false
    requires:
      bins: [curl, jq]
    ---

    # Harvis RAG Search Skill

    Use this skill to search the Harvis local knowledge base before writing code or
    answering questions about the codebase. This prevents you from guessing at
    implementations that already exist.

    ## Step 0 — Health Check First (always run before searching)

    ```bash
    curl -s http://harvis-ai-merged-backend:8000/rag/health \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" | jq .
    ```

    Healthy response looks like:
    ```json
    {
      "ok": true,
      "corpus_counts": {"code": 2241, "docs": 500},
      "models": {
        "code": {"name": "qwen3-embedding:latest", "available": true},
        "docs": {"name": "nomic-embed-text:latest", "available": true}
      }
    }
    ```

    If `ok: false` or a model shows `"available": false`:
    - Do NOT call /rag/search — it will fail
    - Tell the user "RAG is temporarily unavailable" and proceed without it
    - If only docs is available, you can still search `context_type: "docs"`

    ## When to use

    - Before writing a new function or module: search for existing implementations
    - Before answering questions about how something works: search for relevant docs
    - When you need context about the codebase structure or patterns

    ## API

    **Endpoint**: `http://harvis-ai-merged-backend:8000/rag/search`
    **Method**: POST
    **Auth**: `Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN`

    ### Search code corpus (use for: functions, classes, file content, implementation patterns)

    ```bash
    curl -s -X POST http://harvis-ai-merged-backend:8000/rag/search \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" \
      -d '{
        "query": "your search query here",
        "context_type": "code",
        "top_k": 5,
        "score_threshold": 0.3
      }' | jq '.results[] | {score, source, text: .text[:300]}'
    ```

    ### Search docs corpus (use for: architecture docs, README content, design decisions)

    ```bash
    curl -s -X POST http://harvis-ai-merged-backend:8000/rag/search \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" \
      -d '{
        "query": "your search query here",
        "context_type": "docs",
        "top_k": 5,
        "score_threshold": 0.3
      }' | jq '.results[] | {score, source, text: .text[:300]}'
    ```

    ## Response format

    ```json
    {
      "query": "original query",
      "context_type": "code",
      "results": [
        {
          "id": "chunk-id",
          "text": "the relevant code or text chunk",
          "source": "path/to/file.py",
          "metadata": {},
          "score": 0.85
        }
      ],
      "total": 5
    }
    ```

    ## Rules

    - Always search before implementing something that might already exist
    - Use `context_type: "code"` for implementation questions
    - Use `context_type: "docs"` for architecture/design questions
    - If score < 0.5, results may not be relevant — use your judgment
    - Never make web requests to search; this is your only search tool

