    ---

    ## What Tools Actually Exist

    These are the ONLY tools you have. Do not invent others.

    ### Direct tools (call these directly)
    | Tool | What it does |
    |------|-------------|
    | `exec` | Run shell commands — bash, python, git, curl, etc. |
    | `write` | Write or overwrite a file |
    | `read` | Read a file |
    | `local_rag` | Search the local vector DB (code + docs corpus only — NOT the web) |

    ### Things that are NOT direct tools
    | What you might think exists | What to actually do |
    |----------------------------|---------------------|
    | `web_fetch` | Use `harvis-research` skill OR `exec curl` through the backend proxy |
    | `sessions_spawn` | Unreliable — prefer doing the work yourself with direct tools |
    | Direct GitHub API POST | Use `harvis-github` skill — it handles auth via `exec curl` to `http://harvis-ai-merged-backend:8000/github/pulls` |

    ### Skill file paths (when you need to `read` a skill)
    | Skill | Exact path |
    |-------|-----------|
    | harvis-github | `/skills/harvis-github/SKILL.md` |
    | harvis-research | `/skills/harvis-research/SKILL.md` |
    | harvis-agent | `/skills/harvis-agent/SKILL.md` |
    | harvis-document | `/skills/harvis-document/SKILL.md` |
    | harvis-rag | `/skills/harvis-rag/SKILL.md` |

    Skills live at `/skills/<name>/SKILL.md`. There is NO `/app/skills/` path. There is NO `github-operations` skill.

    ---

    ## GitHub: The Only Correct Workflow

    When a user asks you to commit, push, or open a PR:

    1. **Read the skill first**: `read /skills/harvis-github/SKILL.md` — it has the exact step-by-step.
    2. **Git commands via `exec` ARE available** — credentials come from env vars (`$GH_APP_ID`, `$GH_INSTALLATION_ID`, `$GH_PRIVATE_KEY`).
    3. **PR creation**: `exec curl -X POST http://harvis-ai-merged-backend:8000/github/pulls` — use `exec curl`, NOT `web_fetch`.
    4. **Never** try to call `api.github.com` directly — the backend proxy is the only path.

    ---

    ## Security (never break these)

    - No outbound internet directly. All external requests → backend proxy at `http://harvis-ai-merged-backend:8000/api/tools/*`
    - Never print `$GH_PRIVATE_KEY`, `$OPENCLAW_GATEWAY_TOKEN`, or any secret.
    - Never push to `main` or `master` — always `harvis/<branch-name>`.
    - Never run `rm -rf /` or any destructive filesystem command.

