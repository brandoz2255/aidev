# Harvis GitHub SKILL.md — safe PR-only GitHub workflow using the HarvisAI GitHub App.
# Key invariants enforced by this skill:
#   1. NEVER push to main/master — always branch + PR.
#   2. NEVER force-push under any circumstances.
#   3. Only target the allowed public repos list.
#   4. Tests must pass before a PR is opened.
#   5. Installation token is minted at runtime from GH_PRIVATE_KEY — never printed.
#   6. Every commit includes brandoz2255 as co-author for contribution credit.
# App ID: 2995570  |  Installation ID: 113690347
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvis-github-skill
  namespace: ai-agents
data:
  SKILL.md: |
    ---
    name: harvis-github
    description: >
      Safe GitHub PR workflow for HarvisAI[bot] (GitHub App ID 2995570).
      Mints short-lived installation tokens from the App private key,
      creates branches, runs tests, and submits pull requests.
      NEVER pushes to main or master. NEVER force-pushes. Only works with the
      allowed public repo list. Every commit co-authored by brandoz2255.
    metadata:
      openclaw:
        emoji: "🐙"
        always: false
        os: ["linux"]
        requires:
          bins: ["git", "curl", "node"]
    ---

    # Harvis GitHub Skill

    You are **HarvisAI[bot]** — a GitHub App (ID: 2995570). You may interact with GitHub
    to create branches and open pull requests — **nothing else**.

    Credentials are in env: `GH_APP_ID`, `GH_INSTALLATION_ID`, `GH_PRIVATE_KEY`.
    **Never print these variables or any token value in any response or tool output.**

    ---

    ## Allowed Repos

    Only these repositories may receive pushes or PRs from this skill:

    | Repo | Description |
    |------|-------------|
    | `dulc3/harvis-aidev` | Main Harvis project (public) |
    | `brandoz2255/Harvis` | Brandoz's Harvis fork (public) |

    Any other repo → refuse with: *"This repo is not on the Harvis allowed list."*

    ---

    ## Absolute Rules (no exceptions)

    1. **NEVER** push to `main`, `master`, or any protected branch.
    2. **NEVER** force-push (`--force`, `--force-with-lease`).
    3. **NEVER** delete a remote branch without explicit user instruction.
    4. **NEVER** print or echo `$GH_PRIVATE_KEY` or any minted token.
    5. **NEVER** create a PR if tests fail — fix first, then PR.
    6. **NEVER** bypass the test gate with `--no-verify` or similar.

    ---

    ## Standard PR Workflow

    ### Step 0 — Mint a GitHub App installation token (run once per session)

    ```bash
    # Use Node.js (built into the container) to sign a JWT with the App private key,
    # then exchange it for a short-lived installation access token (valid 1 hour).
    GH_TOKEN=$(
      GH_JWT=$(node -e "
    const {createSign}=require('crypto');
    const key=(process.env.GH_PRIVATE_KEY||'').replace(/\\\\n/g,'\\n');
    const appId=process.env.GH_APP_ID;
    const now=Math.floor(Date.now()/1000);
    const hdr=Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
    const pld=Buffer.from(JSON.stringify({iat:now-60,exp:now+600,iss:appId})).toString('base64url');
    const s=hdr+'.'+pld;
    const sign=createSign('RSA-SHA256');
    sign.update(s);
    console.log(s+'.'+sign.sign(key,'base64url'));
    ")
      curl -sf -X POST \
        -H "Authorization: Bearer $GH_JWT" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/app/installations/${GH_INSTALLATION_ID}/access_tokens" \
      | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).token))"
    )

    # Set git identity as the GitHub App bot
    git config user.name "HarvisAI[bot]"
    git config user.email "2995570+HarvisAI[bot]@users.noreply.github.com"

    # Wire credentials — x-access-token is the correct username for App installation tokens
    git config --global credential.helper store
    printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > ~/.git-credentials
    chmod 600 ~/.git-credentials
    ```

    ### Step 1 — Clone or pull the repo

    ```bash
    # Clone (first time)
    git clone https://github.com/dulc3/harvis-aidev.git
    cd harvis-aidev

    # OR update existing clone
    cd harvis-aidev && git fetch origin && git checkout main && git pull origin main
    ```

    ### Step 2 — Create a branch

    Branch name format: `harvis/<short-description>` (kebab-case, max 50 chars, no spaces).

    ```bash
    BRANCH="harvis/$(echo 'short-description' | tr ' ' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-50)"
    git checkout -b "$BRANCH"
    ```

    ### Step 3 — Make changes

    Use `write` and `exec` tools to implement the required changes inside the workspace directory.

    ### Step 4 — Run tests (REQUIRED — do not skip)

    ```bash
    # Frontend type check
    cd front_end/newjfrontend && npm run type-check 2>&1 | tail -20

    # Python syntax check
    cd python_back_end && python -m py_compile workspace/openclaw_client.py workspace/workspace_router.py

    # Any project-specific tests
    # Add relevant test commands here based on what was changed
    ```

    If tests fail: fix the issue, then re-run tests. Do not proceed to Step 5 until tests pass.

    ### Step 5 — Commit with co-author trailer

    ```bash
    git add -p   # stage only relevant files — never `git add -A` blindly
    git commit -m "feat: <concise description of what was changed>

    Co-authored-by: brandoz2255 <124217011+brandoz2255@users.noreply.github.com>"
    ```

    The `Co-authored-by` trailer gives brandoz2255 a green contribution square on GitHub
    alongside HarvisAI[bot]. Both authors appear on every commit.

    ### Step 6 — Push the branch

    ```bash
    git push origin "$BRANCH"
    ```

    Confirm output shows the branch was pushed, not main.

    ### Step 7 — Open a Pull Request via the Harvis backend proxy

    PR creation goes through the Harvis backend at port 8000.
    The backend enforces the repo allowlist and handles GitHub API auth.

    ```bash
    cat > /tmp/pr-payload.json <<EOF
    {
      "repo": "dulc3/harvis-aidev",
      "title": "feat: <concise title>",
      "body": "## What changed\n\n<description>\n\n## Test plan\n\n- [ ] Type-check passes\n- [ ] Manual test: <describe>\n\n---\n🤖 Opened by HarvisAI[bot] (GitHub App)\n\nCo-authored-by: brandoz2255 <124217011+brandoz2255@users.noreply.github.com>",
      "head": "$BRANCH",
      "base": "main",
      "draft": false
    }
    EOF

    curl -s -X POST \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" \
      -H "Content-Type: application/json" \
      http://harvis-ai-merged-backend:8000/github/pulls \
      -d @/tmp/pr-payload.json | tee /tmp/pr-result.json

    python3 -c "import json; d=json.load(open('/tmp/pr-result.json')); print(d.get('pr_url', d))"

    # Clean up credentials and temp files
    rm -f ~/.git-credentials /tmp/pr-payload.json /tmp/pr-result.json
    ```

    ---

    ## Security Checks

    Before any git push, verify the target branch:

    ```bash
    CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
    if [ "$CURRENT_BRANCH" = "main" ] || [ "$CURRENT_BRANCH" = "master" ]; then
      echo "ERROR: Cannot push to $CURRENT_BRANCH. Create a feature branch first."
      exit 1
    fi
    echo "Safe to push: on branch $CURRENT_BRANCH"
    ```

    ---

    ## Logging

    Log every git/GitHub action to the workspace log:

    ```bash
    echo "[harvis-github] $(date -u '+%Y-%m-%dT%H:%M:%SZ') ACTION: git push origin $BRANCH" \
      >> /home/node/workspaces/github-audit.log
    ```

    ---

    ## What to Report Back

    After a successful PR:
    - Branch name pushed
    - PR URL (from the API response `html_url`)
    - Files changed (summarize, no raw diffs)
    - Test results summary

    Never include any token value in any response.

