---
# Static PersistentVolume pinned to rocky2vm.local.
# Using a static local PV (not local-path provisioner) so we control exactly
# which node OpenClaw's data lives on — critical for the security isolation model.
# Retain policy: data survives PVC deletion and must be manually cleaned up.
# Before applying: ensure /var/lib/openclaw-data exists on rocky2vm.local.
#   kubectl debug node/rocky2vm.local -it --image=busybox -- mkdir -p /host/var/lib/openclaw-data
#   (or ssh rocky2vm.local "sudo mkdir -p /var/lib/openclaw-data && sudo chown 1000:1000 /var/lib/openclaw-data")
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openclaw-data-rocky2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/openclaw-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rocky2vm.local

---
# PersistentVolumeClaim — bound explicitly to the static PV above.
# storageClassName: "" + volumeName together force a 1:1 bind to openclaw-data-rocky2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: ai-agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: openclaw-data-rocky2
  resources:
    requests:
      storage: 5Gi

---
# ConfigMap: openclaw.json config file (mounted read-only)
# Key security setting: models.mode = "replace" so NO cloud provider fallback exists.
# channels is intentionally empty — Harvis backend is the only client via WebSocket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai-agents
data:
  # Exec approval config — controls which commands require human approval before running.
  # security: "full" + ask: "off" = all commands run immediately, no approval gate.
  # This is safe here because the NetworkPolicy already restricts egress and the
  # harvis-github skill enforces repo/branch allowlists at a higher level.
  exec-approvals.json: |
    {
      "version": 1,
      "defaults": {
        "security": "full",
        "ask": "off",
        "askFallback": "deny",
        "autoAllowSkills": true
      }
    }

  openclaw.json: |
    {
      "gateway": {
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": false
        }
      },
      "commands": {
        "bash": true,
        "bashForegroundMs": 2000
      },
      "browser": {
        "ssrfPolicy": {
          "hostnameAllowlist": [
            "harvis-ai-merged-backend"
          ]
        }
      },
      "session": {
        "scope": "per-sender",
        "maintenance": {
          "pruneAfter": "90d",
          "maxEntries": 2000
        }
      },
      "models": {
        "mode": "replace",
        "providers": {
          "ollama": {
            "baseUrl": "http://harvis-ai-merged-backend:11434",
            "apiKey": "ollama-local",
            "models": [
              { "id": "qwen3:4b-instruct-2507-q4_K_M", "name": "Qwen3 4B Instruct Q4 (Local)" }
            ]
          },
          "harvis-proxy": {
            "api": "openai-completions",
            "baseUrl": "http://harvis-ai-merged-backend:8000/v1",
            "apiKey": "${OPENCLAW_GATEWAY_TOKEN}",
            "models": [
              { "id": "nvidia-kimi", "name": "Kimi K2.5 (NVIDIA NIM)" },
              { "id": "kimi-k2.5", "name": "Kimi K2.5 (Moonshot)" },
              { "id": "gpt-oss:120b", "name": "GPT-OSS 120B (via Harvis proxy)" },
              { "id": "qwen3:235b-a22b-q8_0", "name": "Qwen3 235B (via Harvis proxy)" }
            ]
          }
        }
      },
      "tools": {
        "elevated": {
          "enabled": true,
          "allowFrom": {
            "discord": ["783435788431261777"]
          }
        }
      },
      "agents": {
        "defaults": {
          "elevatedDefault": "full",
          "timeoutSeconds": 600,
          "model": {
            "primary": "harvis-proxy/nvidia-kimi"
          },
          "subagents": {
            "runTimeoutSeconds": 600,
            "announceTimeoutMs": 180000
          }
        },
        "list": [
          {
            "id": "main",
            "default": true,
            "model": {
