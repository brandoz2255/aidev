          },
          {
            "id": "planner",
            "model": {
              "primary": "harvis-proxy/nvidia-kimi"
            },
            "skills": ["harvis-planner", "harvis-vibecoding", "harvis-github", "harvis-rag", "harvis-research", "harvis-document"]
          },
          {
            "id": "kimi",
            "model": {
              "primary": "harvis-proxy/kimi-k2.5"
            }
          },
          {
            "id": "gpt-oss",
