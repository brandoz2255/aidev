# Harvis Document SKILL.md — DOCX generation + file mimicry via Kimi vision.
# OpenClaw reads this from /skills/harvis-document/SKILL.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvis-document-skill
  namespace: ai-agents
data:
  SKILL.md: |
    ---
    name: harvis-document
    description: >
      Structured document generator — writes DOCX files from user requests.
      Use for reports, changelogs, summaries, proposals, READMEs, meeting notes,
      and any formatted long-form content. Also recreates uploaded files (image,
      PDF, DOCX) as new DOCX artifacts using Kimi vision analysis.
    metadata:
      openclaw:
        emoji: "📝"
        always: false
        requires:
          bins: [curl, jq]
    ---

    # Harvis Document Skill

    Use this skill when asked to write, create, or generate a document — OR
    when asked to recreate/mimic an uploaded file (image, PDF, or DOCX).

    ---

    ## Workflow B: Mimic an uploaded document (use when task contains a file_id)

    ### Step B1 — Analyze the uploaded file

    ```bash
    ANALYSIS=$(curl -s -X POST http://harvis-ai-merged-backend:8000/api/tools/file-analyze \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" \
      -H "Content-Type: application/json" \
      -d "{\"file_id\": \"<file_id from task>\", \"user_id\": ${HARVIS_USER_ID:-0}, \"hint\": \"<user hint if any>\"}")
    echo "$ANALYSIS"
    TITLE=$(echo "$ANALYSIS" | jq -r '.structure.title // "Recreated Document"')
    STRUCTURE=$(echo "$ANALYSIS" | jq '.structure')
    echo "Title: $TITLE"
    ```

    If the request fails, report the error and stop.

    ### Step B2 — Write the recreated document

    Use the `write` tool to create `/tmp/document-draft.md` from the structure.
    Preserve the exact sections, headings, text, tables, and lists from the original.
    Then continue with Steps 3-4 below using `$TITLE` as the document title.

    ---

    ## Workflow A: Write a new document from scratch

    ### Step 1 — Understand the structure

    Plan the document: title, sections, and content for each section.

    ### Step 2 — Write the content

    Use the `write` tool to create a markdown draft at `/tmp/document-draft.md`.
    Write the complete document with proper markdown structure:
    - `#` for the document title
    - `##` for top-level sections
    - `###` for subsections
    - `-` for bullet lists, `1.` for numbered lists
    - `` ``` `` for code blocks, `>` for callouts

    ### Step 3 — Save as artifact

    ```bash
    CONTENT=$(cat /tmp/document-draft.md)

    PAYLOAD=$(jq -n \
      --arg title "<document title>" \
      --arg content "$CONTENT" \
      --argjson user_id "${HARVIS_USER_ID:-0}" \
      '{title: $title, content: $content, format: "docx", sources: [], user_id: $user_id}')

    SAVE_RESULT=$(curl -s -X POST http://harvis-ai-merged-backend:8000/api/tools/document-save \
      -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" \
      -H "Content-Type: application/json" \
      -d "$PAYLOAD")

    echo "$SAVE_RESULT"
    ARTIFACT_ID=$(echo "$SAVE_RESULT" | jq -r '.artifact_id')
    echo "Artifact ID: $ARTIFACT_ID"
    ```

    ### Step 4 — Return structured result

    ```json
    {
      "type": "document_result",
      "title": "<document title>",
      "artifact_id": "<artifact_id from step 3>"
    }
    ```

    Tell the user: "📄 Your document is ready — download it using the card below."

