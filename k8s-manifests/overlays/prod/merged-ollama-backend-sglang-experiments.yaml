# SGLang experiments archive — NOT deployed.
# Contains all Blackwell sm_120 GPTQ/AWQ/fp8 attempts.
# See fixes/sglang-qwen35-27b-blackwell-sm120.md for full debug log.
#
# Summary of what was tried and why each failed:
#
# AWQ (cyankiwi/Qwen3.5-27B-AWQ-BF16-INT4):
#   → gptq_marlin_repack silently corrupts weights on sm_120 → "!!!!..." output
#
# fp8 runtime quant (Qwen/Qwen3.5-27B + --quantization fp8):
#   → ~27GB weight footprint leaves <2GB for KV → OOM in memory pool init
#
# GPTQ-Int4 (Qwen/Qwen3.5-27B-GPTQ-Int4):
#   → Marlin repack holds original+repacked tensors in PyTorch cache simultaneously (~27GB)
#   → Same OOM: post_load_free < pre_load * (1 - mem_fraction_static)
#   → Even at 0.99 mem_fraction_static: capture_bs=[0] → CUDA graph capture fails
#   → Marlin on sm_120 is the fundamental blocker for all quantized formats
#
# Future path: recompile gptq_marlin_repack with sm_120 CUDA arch in sgl-kernel.
# See fixes/sglang-qwen35-27b-blackwell-sm120.md §"Planned Future Work".
#
# Image: dulc3/sglang-patch:test77
#   Bug 4: compressed_tensors WNA16 Marlin alignment crash for GQA KV layers
#   Bug 5: linear_attn (SSM/GDN) weight key mismatch (quant_config=None fix)
#   Bug 6: CPU offloader tied-parameter crash (in-place p.data swap)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-merged-ollama-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: merged-ollama-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: merged-ollama-backend
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1001
      nodeSelector:
        kubernetes.io/hostname: dulc3-os
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z harvis-ai-pgsql 5432; do sleep 2; done
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      containers:
        - name: harvis-backend
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: database-url
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: ollama-api-key
            - name: EXTERNAL_OLLAMA_URL
              value: "https://coyotedev.ngrok.app/ollama"
            - name: EXTERNAL_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: external-ollama-api-key
                  optional: true
            - name: OLLAMA_URL
              value: "http://harvis-ai-llama-embed:8081"
            - name: EMBED_NOMIC_URL
              value: "http://harvis-ai-llama-embed:8081"
            - name: EMBED_QW3_URL
              value: "http://harvis-ai-llama-embed:8082"
            - name: VLLM_URL
              value: "http://localhost:8080/v1"
            - name: LLAMA_URL
              value: "http://localhost:8080/v1"
            - name: BACKEND_URL
              value: "http://harvis-ai-merged-backend:8000"
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: TMPDIR
              value: "/tmp"
            - name: DISABLE_LOCAL_TTS_WORKERS
              value: "false"
            - name: TTS_DEVICE
              value: "cpu"
            - name: WHISPER_DEVICE
              value: "cpu"
            - name: UVICORN_WORKERS
              value: "1"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
          envFrom:
            - configMapRef:
                name: harvis-ai-backend-config
            - secretRef:
                name: harvis-ai-backend-secret
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              memory: 32Gi
              cpu: 12000m
          volumeMounts:
            - name: embedding
              mountPath: /app/embedding
            - name: tmp
              mountPath: /tmp
            - name: ml-models-cache
              mountPath: /models-cache
            - name: images
              mountPath: /app/images
            - name: artifacts
              mountPath: /data/artifacts
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--timeout-keep-alive"
            - "120"
            - "--log-level"
            - "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # ── LAST SGLANG ATTEMPT (GPTQ-Int4 + 0.99 mem_fraction + mamba ratio 0.1) ──
        # Status: capture_bs=[0] — KV pool initialized but too small for CUDA graph capture.
        # Root cause: Marlin repack PyTorch cache bloat leaves ~1.77GB for KV at 32K ctx.
        # At 32K ctx the CUDA graph capture needs at least bs=1 which needs some minimum
        # token budget — 1.77GB × 52.6% KV share / 32KB-per-token ≈ 29K tokens total,
        # which should pass. But the CUDA graph capture for decode needs bs > 0 warmup.
        # Possible additional issue: sm_120 CUDA graph capture itself broken for triton kernel.
        - name: sglang
          image: dulc3/sglang-patch:test77
          imagePullPolicy: Always
          ports:
            - name: sglang
              containerPort: 8080
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
            - name: HF_HOME
              value: "/models-cache/huggingface"
          command: ["python", "-m", "sglang.launch_server"]
          args:
            - "--model-path"
            - "Qwen/Qwen3.5-27B-GPTQ-Int4"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--served-model-name"
            - "qwen3.5-27b"
            - "--context-length"
            - "32768"
            - "--kv-cache-dtype"
            - "fp8_e4m3"
            - "--mem-fraction-static"
            - "0.99"
            - "--mamba-full-memory-ratio"
            - "0.1"
            - "--attention-backend"
            - "triton"
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              nvidia.com/gpu: 1
              memory: 30Gi
              cpu: 8000m

      volumes:
        - name: embedding
          persistentVolumeClaim:
            claimName: harvis-ai-embedding-pvc
        - name: ml-models-cache
          persistentVolumeClaim:
            claimName: ml-models-cache
        - name: tmp
          persistentVolumeClaim:
            claimName: harvis-audio-pvc
        - name: images
          persistentVolumeClaim:
            claimName: harvis-images-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: harvis-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-merged-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
