# AMD (ROCm) override — GPU-accelerates OLLAMA on supported AMD cards.
#
#   ./install.sh --backend amd          # writes COMPOSE_FILE into .env for you
#   # or manually:
#   docker compose -f docker-compose.yaml -f docker-compose.amd.yml up -d
#
# Scope (v0, honest): only OLLAMA — the main inference engine — gets ROCm
# acceleration; that's ~90% of the win. llmfit has no ROCm image and the backend
# + tts-service ship CUDA PyTorch builds, so voice (TTS/Whisper) runs on CPU
# here. A ROCm-torch voice image is a tracked follow-up.
#
# Requirements:
#   - A ROCm-supported AMD GPU (discrete RDNA/CDNA; most consumer iGPUs are NOT).
#   - /dev/kfd and /dev/dri present on the host; user in `video` + `render` groups.
#   - Some cards need HSA_OVERRIDE_GFX_VERSION (e.g. 10.3.0 / 11.0.0) — set it in .env.
#
# NOTE: `devices: !reset []` is required to clear the base's nvidia reservation —
# a plain `devices: []` is silently ignored by the merge. Empirical floor:
# Compose 2.19 honours the tag, 2.18.1 silently ignores it — install.sh verifies
# the rendered merge behaviorally instead of trusting versions.
services:
  ollama:
    image: ollama/ollama:rocm
    runtime: runc
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    environment:
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    deploy:
      resources:
        reservations:
          devices: !reset []

  # No ROCm image exists for llmfit — runs CPU-only (non-critical hardware scanner;
  # the cookbook proxy degrades gracefully when it reports CPU).
  llmfit:
    runtime: runc
    deploy:
      resources:
        reservations:
          devices: !reset []

  # CUDA torch build → voice runs on CPU with AMD (ROCm voice image = follow-up).
  backend:
    runtime: runc

  tts-service:
    environment:
      TTS_FORCE_GPU: "false"
    deploy:
      resources:
        reservations:
          devices: !reset []
