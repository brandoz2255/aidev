<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				// FOUC-critical mirror of src/lib/themes.ts — keep in sync. Data-driven so a
				// light theme (airy/warm) paints its surfaces on the FIRST frame, not after hydration.
				const t = localStorage.theme;
				const BASE = { system: null, dark: 'dark', 'harvis-dark': 'dark', 'oled-dark': 'dark', light: 'light', airy: 'light', warm: 'light', her: 'her' };
				const VARS = {
					'harvis-dark': { '--color-gray-800': '#1a1f2e', '--color-gray-850': '#141823', '--color-gray-900': '#0e111a', '--color-gray-950': '#090b12' },
					'oled-dark': { '--color-gray-800': '#101010', '--color-gray-850': '#050505', '--color-gray-900': '#000000', '--color-gray-950': '#000000' },
					'airy': { '--color-gray-50': '#f4f6f8', '--color-gray-100': '#eef1f5', '--color-gray-200': '#e3e8ee', '--color-blue-400': '#8b8ef7', '--color-blue-500': '#6d70f0', '--color-blue-600': '#5457e6', '--color-blue-700': '#4143c9' },
					'warm': { '--color-gray-50': '#f5f1e8', '--color-gray-100': '#efe9dc', '--color-gray-200': '#e6ddcc', '--color-gray-700': '#3a352c', '--color-gray-800': '#2b2a26', '--color-gray-900': '#211f1b', '--color-blue-400': '#e89f86', '--color-blue-500': '#df8365', '--color-blue-600': '#d0684a', '--color-blue-700': '#b5543a' }
				};
				const FONT = { warm: "'InstrumentSerif', Georgia, 'Times New Roman', serif" };
				const META = { dark: '#00030b', 'harvis-dark': '#0e111a', 'oled-dark': '#000000', light: '#ffffff', airy: '#f4f6f8', warm: '#f5f1e8', her: '#983724' };

				const base = t === 'system' || BASE[t] == null ? (prefersDarkTheme ? 'dark' : 'light') : BASE[t];
				document.documentElement.classList.add(base);
				if (t === 'her') document.documentElement.classList.add('her');
				document.documentElement.classList.add('theme-' + (BASE[t] !== undefined ? t : 'dark'));
				document.documentElement.dataset.theme = t;
				if (VARS[t]) for (const k in VARS[t]) document.documentElement.style.setProperty(k, VARS[t][k]);
				if (FONT[t]) document.documentElement.style.setProperty('--theme-font-body', FONT[t]);
				metaThemeColorTag.setAttribute('content', t === 'system' ? (prefersDarkTheme ? '#00030b' : '#ffffff') : (META[t] || (base === 'dark' ? '#00030b' : '#ffffff')));

				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/harvis-logo.svg'
					: '/static/harvis-logo.svg';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#00030b');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				logo.src = isDarkMode ? '/static/harvis-logo.svg' : '/static/harvis-logo.svg';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<title>Harvis</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/harvis-logo.svg"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		/* Splash background must match the resolved theme on FIRST paint. The inline
		   loader above adds base classes (`dark`/`light`/`her`) plus `theme-<name>`
		   (e.g. `theme-harvis-dark`, `theme-airy`) — these selectors mirror that
		   classing and the loader's META color map exactly. Hex is deliberate here:
		   this runs pre-hydration, before any token CSS exists. Keep in sync with
		   the META map in the loader script and src/lib/themes.ts. */
		#splash-screen {
			background: #fff;
		}

		html.dark #splash-screen {
			background: #00030b;
		}

		html.her #splash-screen {
			background: #983724;
		}

		/* Theme-specific overrides — same specificity as the base rules, so they
		   must stay AFTER them (later rule wins). */
		html.theme-harvis-dark #splash-screen {
			background: #0e111a;
		}

		html.theme-oled-dark #splash-screen {
			background: #000000;
		}

		html.theme-airy #splash-screen {
			background: #f4f6f8;
		}

		html.theme-warm #splash-screen {
			background: #f5f1e8;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: none;
		}

		#progress-bar {
			display: none;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #progress-background {
			display: block;
		}

		html.her #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
	</style>
</html>
