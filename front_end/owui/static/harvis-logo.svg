<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 60 70" fill="none">
  <defs>
    <filter id="harvisGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="harvisBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF" />
      <stop offset="100%" stop-color="#2F5FD8" />
    </linearGradient>
    <linearGradient id="harvisScreenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2C5D" />
      <stop offset="100%" stop-color="#0D152A" />
    </linearGradient>
  </defs>

  <!-- Single Harvis robot. Two accent blues on purpose: #6FA0FF for the face, which is
       always drawn on the robot's own near-black screen, and #3B76E0 for the antennas and
       arms, which sit on the PAGE. The lighter blue is 2.6:1 on white — it washed out in
       light mode. #3B76E0 is 4.3:1 on white and 3.9:1 on the dark splash, so it clears the
       3:1 non-text floor in both themes. Do not collapse them into one value. -->
  <g>
    <line x1="20" y1="8" x2="16" y2="0" stroke="#3B76E0" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="2" r="3" fill="#3B76E0" filter="url(#harvisGlow)" />
    <line x1="40" y1="8" x2="44" y2="0" stroke="#3B76E0" stroke-width="2" stroke-linecap="round" />
    <circle cx="44" cy="2" r="3" fill="#3B76E0" filter="url(#harvisGlow)" />

    <rect x="12" y="8" width="36" height="30" rx="6" fill="url(#harvisBodyGradient)" />
    <rect x="16" y="12" width="28" height="22" rx="3" fill="url(#harvisScreenGradient)" />

    <path d="M21 21 Q24 17 27 21" stroke="#6FA0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M33 21 Q36 17 39 21" stroke="#6FA0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M24 28 Q30 33 36 28" stroke="#6FA0FF" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />

    <rect x="14" y="38" width="10" height="28" rx="3" fill="url(#harvisBodyGradient)" />
    <rect x="36" y="38" width="10" height="28" rx="3" fill="url(#harvisBodyGradient)" />
    <rect x="14" y="48" width="32" height="8" rx="2" fill="url(#harvisBodyGradient)" />

    <rect x="4" y="42" width="6" height="14" rx="3" fill="#3B76E0" />
    <rect x="50" y="42" width="6" height="14" rx="3" fill="#3B76E0" />
  </g>
</svg>
