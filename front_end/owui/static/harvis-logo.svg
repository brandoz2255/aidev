<svg xmlns="http://www.w3.org/2000/svg" width="192" height="140" viewBox="0 0 96 70" fill="none">
  <defs>
    <filter id="harvisGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="harvisBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF" />
      <stop offset="100%" stop-color="#2F5FD8" />
    </linearGradient>
    <linearGradient id="harvisBuddyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FB3F2" />
      <stop offset="100%" stop-color="#5B8DEF" />
    </linearGradient>
    <linearGradient id="harvisScreenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2C5D" />
      <stop offset="100%" stop-color="#0D152A" />
    </linearGradient>
  </defs>

  <!-- big Harvis -->
  <g>
    <line x1="20" y1="8" x2="16" y2="0" stroke="#6FA0FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="2" r="3" fill="#6FA0FF" filter="url(#harvisGlow)" />
    <line x1="40" y1="8" x2="44" y2="0" stroke="#6FA0FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="44" cy="2" r="3" fill="#6FA0FF" filter="url(#harvisGlow)" />

    <rect x="12" y="8" width="36" height="30" rx="6" fill="url(#harvisBodyGradient)" />
    <rect x="16" y="12" width="28" height="22" rx="3" fill="url(#harvisScreenGradient)" />

    <path d="M21 21 Q24 17 27 21" stroke="#6FA0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M33 21 Q36 17 39 21" stroke="#6FA0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M24 28 Q30 33 36 28" stroke="#6FA0FF" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />

    <rect x="14" y="38" width="10" height="28" rx="3" fill="url(#harvisBodyGradient)" />
    <rect x="36" y="38" width="10" height="28" rx="3" fill="url(#harvisBodyGradient)" />
    <rect x="14" y="48" width="32" height="8" rx="2" fill="url(#harvisBodyGradient)" />

    <rect x="4" y="42" width="6" height="14" rx="3" fill="#6FA0FF" />
    <rect x="50" y="42" width="6" height="14" rx="3" fill="#6FA0FF" />
  </g>

  <!-- little buddy -->
  <g transform="translate(58 26.6) scale(0.62)">
    <line x1="20" y1="8" x2="16" y2="0" stroke="#BBD6FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="2" r="3" fill="#BBD6FF" filter="url(#harvisGlow)" />
    <line x1="40" y1="8" x2="44" y2="0" stroke="#BBD6FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="44" cy="2" r="3" fill="#BBD6FF" filter="url(#harvisGlow)" />

    <rect x="12" y="8" width="36" height="30" rx="6" fill="url(#harvisBuddyGradient)" />
    <rect x="16" y="12" width="28" height="22" rx="3" fill="url(#harvisScreenGradient)" />

    <path d="M21 21 Q24 17 27 21" stroke="#BBD6FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M33 21 Q36 17 39 21" stroke="#BBD6FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />
    <path d="M24 28 Q30 33 36 28" stroke="#BBD6FF" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#harvisGlow)" />

    <rect x="14" y="38" width="10" height="28" rx="3" fill="url(#harvisBuddyGradient)" />
    <rect x="36" y="38" width="10" height="28" rx="3" fill="url(#harvisBuddyGradient)" />
    <rect x="14" y="48" width="32" height="8" rx="2" fill="url(#harvisBuddyGradient)" />

    <rect x="4" y="42" width="6" height="14" rx="3" fill="#BBD6FF" />
    <rect x="50" y="42" width="6" height="14" rx="3" fill="#BBD6FF" />
  </g>
</svg>
